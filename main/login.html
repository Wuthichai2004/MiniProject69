<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ระบบสะสมแต้มการแยกขยะ</title>
    <link rel="stylesheet" href="login.css?v=2">
    <link rel="stylesheet" href="theme.css?v=7">
    <script>
        if (location.protocol === "file:" || (location.port && location.port !== "80") || !location.pathname.startsWith("/MiniProject69/")) {
            location.replace("http://localhost/MiniProject69/main/login.html");
        }
    </script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <h2>♻️ ระบบสะสมแต้มการแยกขยะ</h2>
                <p>Waste Sorting Point System</p>
            </div>
        </div>
    </header>

    <main class="login-main">
        <div class="login-card">
            <div class="title-section">
                <div class="icon">♻️</div>
                <h1>เข้าสู่ระบบ</h1>
                <p>เข้าสู่ระบบเพื่อบันทึกการแยกขยะและสะสมคะแนน</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้</label>
                    <input type="text" id="username" name="username" placeholder="กรอกชื่อผู้ใช้" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-btn">เข้าสู่ระบบ</button>
            </form>

            <div class="register-link">
                <span>ยังไม่มีบัญชี?</span>
                <a href="register.html">สมัครสมาชิก</a>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
